backend:
  name: github
  repo: i-am-sarath/88cutouts-web
  branch: main
  # base_url is intentionally NOT set.
  #
  # Editing locally needs no authentication at all: run `npm run dev`, open
  # http://localhost:4321/admin/ and choose "Work with Local Repository".
  # Changes are written straight to the files on disk; commit them yourself.
  #
  # To edit from the live site you must deploy an OAuth client, because Sveltia
  # has no hosted default. Deploy https://github.com/sveltia/sveltia-cms-auth
  # as a Cloudflare Worker, register a GitHub OAuth App (callback
  # <worker-url>/callback), set GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET /
  # ALLOWED_DOMAINS=88cutouts.com on the Worker, then uncomment:
  #
  # base_url: https://<your-worker>.workers.dev
  #
  # Leaving a placeholder URL here breaks login outright, which is why it's
  # commented rather than stubbed.

media_folder: "public/stickers"
public_folder: "/stickers"

collections:
  - name: "stickers"
    label: "Stickers & Frames"
    folder: "src/content/stickers"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Image (transparent PNG)"
        name: "image"
        widget: "image"
        media_folder: "/public/stickers"
        public_folder: "/stickers"
      - label: "Type"
        name: "type"
        widget: "select"
        options: ["sticker", "frame"]
        default: "sticker"
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["coquette", "flowers", "hearts", "retro", "y2k", "text", "paper", "frames", "cute", "aesthetic", "minimal", "seasonal", "general"]
        default: "general"
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Date Added", name: "date", widget: "datetime", type: "date", format: "YYYY-MM-DD" }

  - name: "dps"
    label: "DPs & Profile Pictures"
    folder: "src/content/dps"
    create: true
    slug: "{{slug}}"
    # The DP gallery is entirely what you upload here — nothing is generated.
    # Use square images, 900x900 or larger. They are shown as circles, so keep
    # the subject centred and away from the corners.
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Shown on the card and as the page heading, e.g. \"Moonlit Sad Girl DP\"" }
      - label: "Image (square, 900x900 or larger)"
        name: "image"
        widget: "image"
        media_folder: "/public/dps/uploads"
        public_folder: "/dps/uploads"
      - label: "Collection"
        name: "collection"
        widget: "select"
        options: ["girls", "stylish-girls", "attitude-girls", "sad-girl", "whatsapp", "whatsapp-girls", "instagram", "instagram-aesthetic", "cute", "aesthetic"]
        default: "girls"
      - { label: "Description", name: "description", widget: "text", required: false, hint: "One line about it — used as the page's search description. Optional." }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, hint: "Featured DPs sort to the top of their collection." }
      - { label: "Date Added", name: "date", widget: "datetime", type: "date", format: "YYYY-MM-DD" }

  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    # Long-form guides. Aim for something that actually answers the question in
    # the title — thin posts help nobody and get the site nowhere.
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text", hint: "One or two sentences. Used as the meta description and the standfirst under the headline." }
      - { label: "Date", name: "date", widget: "datetime", type: "date", format: "YYYY-MM-DD" }
      - { label: "Last updated", name: "updated", widget: "datetime", type: "date", format: "YYYY-MM-DD", required: false }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["guides", "aesthetics", "technical", "instagram", "whatsapp"]
        default: "guides"
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - label: "Cover sticker (optional)"
        name: "cover"
        widget: "image"
        required: false
        media_folder: "/public/stickers"
        public_folder: "/stickers"
        hint: "A sticker from the library, shown on the blog card."
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - label: "FAQ"
        name: "faq"
        widget: "list"
        required: false
        summary: "{{fields.q}}"
        fields:
          - { label: "Question", name: "q", widget: "string" }
          - { label: "Answer", name: "a", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "ransomLetters"
    label: "Ransom Note Letters"
    files:
      - name: "letters"
        label: "Letter Cutouts"
        file: "src/content/ransomLetters/letters.json"
        fields:
          - label: "Letters"
            name: "letters"
            widget: "list"
            fields:
              - { label: "Character", name: "character", widget: "string", hint: "Single character, e.g. A, a, 7, !" }
              - label: "Image"
                name: "image"
                widget: "image"
                media_folder: "/public/ransom-letters"
                public_folder: "/ransom-letters"
